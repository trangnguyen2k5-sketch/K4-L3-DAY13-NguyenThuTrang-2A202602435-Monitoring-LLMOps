alerts:
  - name: HighTailLatencyP95
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: devops-oncall
    runbook: docs/alerts.md#alert-1

  - name: HighErrorRateSpike
    severity: critical
    condition: error_rate_pct > 2
    duration: 3m
    type: symptom-based
    channel: slack
    owner: devops-oncall
    runbook: docs/alerts.md#alert-2

  - name: LowRetrievalSuccessRate
    severity: critical
    condition: retrieval_success_rate_pct < 90
    duration: 5m
    type: symptom-based
    channel: slack
    owner: rag-team
    runbook: docs/alerts.md#alert-3
